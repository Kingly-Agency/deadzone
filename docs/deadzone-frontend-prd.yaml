    - "ErrorBoundary"
    - "StaleDataIndicator"
    - "ConnectionStatus"
    - "FocusTrap"
    - "AriaLiveAlerts"
    - "ColorBlindToggle"
    - "KeyboardHintRow"
  composition_rules:
    - id: CR-01
      rule: "All data panels compose SkeletonPanel, EmptyState, ErrorBoundary, and populated content."
      applies_to: ["MetricsBar", "AlertsPanel", "ZoneDetailCard", "SensorDetailCard", "ScenarioPicker", "RawEventTail", "HeatmapLayer"]
    - id: CR-02
      rule: "HeatmapLayer never renders populated state without Legend."
      applies_to: ["HeatmapLayer", "Legend"]
    - id: CR-03
      rule: "ModeChip never renders without ProvenanceBadge."
      applies_to: ["Header", "ModeChip", "ProvenanceBadge"]
    - id: CR-04
      rule: "AlertToast only surfaces for critical alerts or reset confirmations."
      applies_to: ["AlertToast", "AlertsPanel", "ResetButton"]
    - id: CR-05
      rule: "Topology overlay swaps emphasis with heatmap instead of stacking competing layers."
      applies_to: ["MainCanvas", "HeatmapLayer", "SensorNode", "CoverageGapHatch"]
    - id: CR-06
      rule: "Mode switch uses crossfade and skeleton intermediate state; no white flash."
      applies_to: ["AppShell", "ModeDropdown", "MainCanvas", "AlertsPanel"]

visual_and_interaction_design:
  tone: "Dense operations console, restrained and useful."
  avoid:
    - "Landing page."
    - "Oversized hero."
    - "Decorative gradients as primary visual."
    - "Identity-tracking language."
    - "Blank panels."
    - "Red-green-only encoding."
    - "Topology as first-screen default."
  layout:
    desktop:
      - "Header at top, metrics below, map canvas main, alerts rail right, footer bottom."
      - "Zone and topology detail use right-side drawer, preserving map context."
      - "Replay drawer uses bottom/full-width layout for timeline usability."
    mobile:
      - "Map-first view."
      - "Alerts and replay use bottom sheets."
      - "Layer controls collapse to icon toolbar with accessible labels."
  design_tokens:
    density_ramp: "viridis or plasma, perceptually uniform"
    mode_mock: "#3B82F6"
    mode_replay: "#F59E0B"
    mode_live: "#10B981"
    mode_mesh: "#8B5CF6"
    severity_info: "#3B82F6"
    severity_warn: "#F59E0B"
    severity_critical: "#EF4444 plus non-color pattern or icon"
    sensor_healthy: "green with label/icon"
    sensor_degraded: "amber with label/icon"
    sensor_offline: "neutral/red with label/icon"
    typography:
      body: "Inter or system-ui"
      mono: "JetBrains Mono or system monospace for timestamps and raw event tail"
      numeric: "tabular numerals for metrics, clock, and counters"
  timing:
    skeleton_render: "under 200ms"
    first_meaningful_paint: "target under 2000ms after app mount when data is available"
    websocket_timeout_to_error: "5000ms"
    stale_threshold: "30s no frames in Live/Mesh"
    fallback_offer_threshold: "60s no frames"
    mode_crossfade: "300ms"
    drawer_open: "250ms"
    drawer_close: "200ms"
    reset_fade_to_t0: "400ms"
    timed_mock_alert: "90s from demo session start"

accessibility_and_privacy:
  accessibility:
    - "WCAG AA contrast for text and critical UI controls."
    - "No semantic state is conveyed by color alone."
    - "Heatmap data has text equivalents through metrics, zone detail, and alerts."
    - "Critical alerts use aria-live assertive; non-critical alert changes use polite announcements."
    - "Toast auto-dismiss can be paused on hover/focus."
    - "Escape closes the topmost open modal, popover, drawer, or selected sensor/zone layer."
    - "Focus is trapped in modal and overlay popover contexts."
    - "Keyboard shortcuts are discoverable in settings and disabled while text input is focused."
    - "Reduced motion disables nonessential blob/vector animation while preserving state changes."
    - "Touch targets are at least 44px on mobile."
  privacy:
    - "Use aggregate density, pressure, movement, and sensor health language."
    - "Do not display MAC addresses, stable device identifiers, or person-level counts attributed to an individual."
    - "Raw event tail is diagnostic only and must be aggregate-safe."
    - "Public-screen panic risk is out of MVP; production mode would need auth and display policy."

anti_patterns:
  - id: AP-01
    pattern: "Landing page before dashboard"
    mitigation: "Dashboard is route default and first viewport."
  - id: AP-02
    pattern: "Mock data without provenance"
    mitigation: "ModeChip plus ProvenanceBadge visible at all times."
  - id: AP-03
    pattern: "Heatmap without legend or unit"
    mitigation: "Legend is required composition with populated HeatmapLayer."
  - id: AP-04
    pattern: "Blank panels during loading, no data, or errors"
    mitigation: "Skeleton, EmptyState, ErrorBoundary composition rule."
  - id: AP-05
    pattern: "White flash during mode switch"
    mitigation: "Crossfade plus skeleton intermediate state."
  - id: AP-06
    pattern: "Page reload to reset demo"
    mitigation: "R key and ResetButton update app state without reload."
  - id: AP-07
    pattern: "Wi-Fi-dependent dead-Wi-Fi-zone story left unexplained"
    mitigation: "UI labels Live as optional and Mesh as distributed fallback; pitch must address this explicitly."
  - id: AP-08
    pattern: "Topology front-and-center for all users"
    mitigation: "Topology is toggle overlay, default off."
  - id: AP-09
    pattern: "Identity-tracking framing"
    mitigation: "Use aggregate-only language and suppress stable identifiers."

implementation_order:
  - order: 1
    item: "Define TypeScript types from deadzone-api-contract.yaml."
    unlocks: ["API client", "fixtures", "stream store"]
  - order: 2
    item: "Build API client, stream store, fixtures, and snapshot-first render path."
    unlocks: ["Dashboard data binding"]
  - order: 3
    item: "Build AppShell, Header, ModeChip, ProvenanceBadge, MetricsBar, footer, and basic state wrappers."
    unlocks: ["First viewport"]
  - order: 4
    item: "Build MainCanvas with HeatmapLayer, Legend, ZoneOverlay, MovementVectors, and reduced-motion behavior."
    unlocks: ["Visual proof"]
  - order: 5
    item: "Build AlertsPanel with empty, populated, critical toast, zone focus, and visual ack."
    unlocks: ["90s demo alert"]
  - order: 6
    item: "Build reset flow and timed Mock alert behavior."
    unlocks: ["Demo resilience"]
  - order: 7
    item: "Build Replay picker and transport against replay endpoints."
    unlocks: ["Replay trust path"]
  - order: 8
    item: "Build Zone detail drawer."
    unlocks: ["Operator path"]
  - order: 9
    item: "Build ModeDropdown with availability and crossfade mode switching."
    unlocks: ["Mock/Replay/Live/Mesh story"]
  - order: 10
    item: "Build topology overlay, sensor detail, and raw event tail."
    unlocks: ["Investigator trust path"]
  - order: 11
    item: "Build settings, color-blind toggle, keyboard hints, and responsive bottom sheets."
    unlocks: ["Accessibility polish"]

acceptance_matrix:
  dashboard:
    - "No marketing or explanatory landing screen appears before dashboard."
    - "Header, mode, provenance, metrics, map, alerts, and footer are visible at desktop first viewport."
    - "Dashboard can render from fixture or snapshot without WebSocket."
  stream:
    - "Config and snapshot are fetched before WebSocket usage."
    - "Sequence ordering is enforced."
    - "Disconnect preserves last snapshot and marks stale."
    - "Recoverable errors do not clear the map."
  visualization:
    - "Heatmap changes when snapshot or zone_update data changes."
    - "Legend and unit are present with populated heatmap."
    - "Selected alert focuses corresponding zone."
    - "Reduced motion mode remains understandable."
  alerts:
    - "No-alert state is meaningful and not blank."
    - "At least four alert kinds can render: congestion, queue_buildup, hallway_stall, sensor_offline."
    - "Acknowledged alerts become visually distinct and do not disappear without explanation."
  replay:
    - "Scenario list renders from API or fixture."
    - "Play, pause, restart, speed, and seek/scrub controls call the contract endpoint."
    - "Replay mode keeps provenance visible."
  modes:
    - "Mock, Replay, BLE, Wi-Fi, Mesh, and Hybrid display with correct labels and availability."
    - "Unavailable Live/Mesh modes show reason and remain discoverable."
    - "Mode switch crossfades and does not page reload."
  reset:
    - "R key and reset button work outside text inputs."
    - "Mock/Replay reset clears alerts and re-arms 90s alert without reload."
    - "Live/Mesh reset requires confirmation."
  topology:
    - "Sensor nodes, status, latency, and link quality can render from snapshot."
    - "Offline sensor and stale stream states are distinct."
    - "Coverage gaps use hatching."
    - "Raw event tail excludes device identifiers."
  accessibility:
    - "Keyboard navigation reaches mode, reset, topology, alerts, zone detail, replay, and settings."
    - "Focus is trapped in modal/popover contexts."
    - "Color-blind-safe palette is used for density and critical states include non-color channel."
    - "390px viewport remains usable with no text overlap."

open_questions:
  - id: OQ-01
    question: "What real or mocked floorplan asset should be used for the venue map?"
    impact: "Zone polygons, coordinate bounds, and visual credibility."
    source: "ux-b summary open questions"
  - id: OQ-02
    question: "Are replay scenarios synthetic-recorded or actual recordings?"
    impact: "Provenance label, investigator trust, and pitch wording."
    source: "ux-b summary open questions"
  - id: OQ-03
    question: "Should Live and Mesh controls be enabled in the hackathon demo or shown disabled with reasons?"
    impact: "Mode switch behavior and pitch risk around RF permissions."
    source: "deadzone-backend-scope mode_strategy"
  - id: OQ-04
    question: "Should route-level deep links be implemented for replay/topology/zone detail in MVP?"
    impact: "QA and demo scripting convenience; not required for first viewport."
    source: "compare_contrast IA resolution"
  - id: OQ-05
    question: "Who signs off on color-blind validation?"
    impact: "Acceptance for heatmap palette and critical threshold patterning."
    source: "ux-b LC-5"

