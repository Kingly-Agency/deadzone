meta:
  project: deadzone
  artifact: frontend_prd
  version: 0.1.0
  status: draft_for_implementation
  created_at: "2026-05-14"
  output_format_reason: "YAML PRD created to satisfy the local no-new-markdown restriction."
  canonical_home: "docs/"
  supersedes_or_extends:
    - path: ".lev/pm/specs/deadzone-frontend-partner-brief.yaml"
      relationship: "extends"
      note: "The partner brief remains the short implementation brief; this file is the exhaustive FE PRD."
  source_runs:
    canonical_run:
      id: ux-a
      path: ".lev/ux/20260514-101228-deadzone-mvp-prd/"
      role: "canonical implementation handoff pass"
      emphasis:
        - "Stable FE/BE contract and partner handoff."
        - "Operations Dashboard, Replay Lab, Sensor Mesh screen framing."
        - "Component boundaries aligned to API contract."
        - "Mock/replay/WebSocket first; live adapters optional."
    richer_run:
      id: ux-b
      path: ".lev/ux/20260514-101706-deadzone-mvp-crowd-intel/"
      role: "richer product, interaction, state, and accessibility pass"
      emphasis:
        - "Mock -> Replay -> Live Sensors -> Mesh progression."
        - "Hackathon judge verification in 5 minutes, with 30 second glance comprehension."
        - "Single-screen dashboard with progressive disclosure overlays."
        - "Detailed FSM, accessibility, demo reset, mode switch, topology, and alert behavior."
  contract_refs:
    - ".lev/pm/specs/deadzone-api-contract.yaml"
    - ".lev/pm/specs/deadzone-event-envelope.schema.json"
    - ".lev/pm/specs/deadzone-backend-scope.yaml"
    - ".lev/pm/plans/deadzone-agent-task-bundle.yaml"

objective:
  statement: >
    Build the DeadZone frontend as a local-first operations dashboard that proves
    aggregate crowd intelligence quickly, honestly, and deterministically.
    The first viewport must make a hackathon judge understand the product in
    30 seconds while giving skeptical users a clear drill-down path into modes,
    replay, topology, alerts, and source freshness.
  north_star_outcome: >
    A judge runs docker compose, opens localhost:3000, immediately sees an updating
    venue heatmap with numeric metrics and provenance, observes a deterministic alert
    within the demo window, and can switch or inspect modes without a page reload.
  primary_audience:
    - "Hackathon judges: generalist spectators and skeptical technical investigators."
    - "Venue operators and public-safety coordinators evaluating future operational fit."
    - "Frontend and backend implementers building against a stable local contract."

compare_contrast:
  summary:
    agreement:
      - "Both runs require dashboard-first UX, not marketing or a landing page."
      - "Both runs prioritize mock/replay/WebSocket stability before live sensing."
      - "Both runs require visible mode, freshness, stale/offline, alert, sensor, and replay states."
      - "Both runs reject raw identity tracking and require aggregate venue intelligence."
      - "Both runs treat topology as a supporting trust story, not the main first-viewport proof."
    differences:
      - "UX-A is implementation-handoff oriented and maps cleanly to existing API/task specs."
      - "UX-B is product-interaction oriented and contains the fuller user model, state machine, modes, timing budgets, accessibility rules, and wireframe variants."
      - "UX-A proposes three primary screens: Operations Dashboard, Replay Lab, Sensor Mesh."
      - "UX-B proposes one primary dashboard route with overlays/drawers/popovers instead of page transitions."
      - "UX-A has six broad jobs; UX-B expands them into seven ranked jobs and four user archetypes."
    resolution: >
      Use UX-A as the canonical implementation and contract anchor, but adopt UX-B as
      the product behavior authority wherever it adds specificity or resolves UX risk.
      The frontend MVP should be a single dashboard surface with progressive-disclosure
      overlays. Replay Lab and Sensor Mesh may exist as route/deep-link labels later,
      but they must not displace the first-screen dashboard experience.
  artifact_by_artifact:
    request:
      ux_a: "Start UX while scoping backend, then prepare FE/UI handoff from UX and API contracts."
      ux_b: "Run UX on the full DeadZone MVP PRD, including Mock, Replay, Live Sensors, Mesh, stack, audience, and docker-compose demo path."
      decision: "Build a frontend PRD that preserves contract readiness from UX-A and product richness from UX-B."
    problem_spec:
      ux_a: "Local deterministic demo with venue heatmap, congestion signals, replay controls, and sensor-node status."
      ux_b: "Five-minute judge verification of passive-RF crowd intelligence with honest data provenance and 30 second comprehension."
      decision: "State success in both implementation and judging terms: stable local startup plus visible proof quickly."
    research:
      ux_a: "Three synthetic lenses: judge, venue ops, frontend partner."
      ux_b: "Five named synthetic personas plus four archetypes: spectator, investigator, operator, developer."
      decision: "Use UX-B archetypes for product decisions; keep FE partner as an implementation stakeholder."
    jobs:
      ux_a: "Six broad jobs around dashboard comprehension, alerts, provenance, stable payloads, extensibility, and degradation."
      ux_b: "Seven ranked jobs around glance, trust, act, rehearse, validate coverage, investigate, and shared operating picture."
      decision: "Merge jobs, mark shared operating picture as post-MVP, and keep stable payloads as a non-user-facing implementation job."
    information_architecture:
      ux_a: "Three primary tabs: Operations Dashboard, Replay Lab, Sensor Mesh."
      ux_b: "Single-screen dashboard with Zone Detail, Sensor Topology, Replay Picker, Mode Switcher, Alerts, Reset, and Settings as overlays."
      decision: "Use one default route with overlays for MVP. Optional routes can deep-link into overlay states after the dashboard is stable."
    interaction_fsm:
      ux_a: "3 screens, 18 states, 16 transitions; sufficient for first implementation."
      ux_b: "8 screens/overlays, 43 states, 97 transitions plus global transitions and timing constraints."
      decision: "Use UX-B FSM as behavior authority; use UX-A states as the minimum fallback if implementation time compresses."
    components:
      ux_a: "12 core reusable components tied to contract payloads."
      ux_b: "37 components with composition rules, tokens, accessibility, and naming principles."
      decision: "Implement UX-A core components first, with UX-B composition rules and tokens as requirements."
    wireframes:
      ux_a: "3 screen wireframes with dashboard, replay, sensor mesh, and mobile behavior."
      ux_b: "7 screen/overlay wireframes with loading, empty, error, stale, reset, alert, mode, and topology variants."
      decision: "Use UX-B wireframes as detailed acceptance coverage. Keep UX-A screen framing as an implementation map."
    constraints:
      ux_a: "Dashboard first, visible freshness, aggregate intelligence, replay explainability, diagnostics secondary."
      ux_b: "P0 constraints for legend/metrics, mode badge, nonblank states, timed alert, crossfade, and no reload."
      decision: "All UX-B P0 constraints are mandatory. UX-A constraints remain mandatory where not superseded."

scope:
  in:
    - "App shell and first-screen operations dashboard."
    - "Header with brand, mode chip, provenance badge, reset, topology toggle, and settings."
    - "Metrics bar with total occupancy, capacity, peak zone, trend, active alerts, and offline sensors."
    - "Venue map canvas with heatmap, zone polygons, flow vectors, legend, and selected-zone highlighting."
    - "Always-visible alerts panel on desktop and accessible alert bottom sheet on small viewports."
    - "Zone detail slide-in/bottom sheet with occupancy, capacity, trend sparkline, and zone alerts."
    - "Replay scenario picker and transport controls for deterministic playback."
    - "Mode switcher for backend modes mock, replay, ble, wifi, mesh, and hybrid, with UI grouping for Live Sensors."
    - "Sensor topology overlay and sensor detail drawer with coverage gaps, node health, and raw event tail."
    - "Demo reset via button and R key, without page reload."
    - "Loading, empty, populated, stale, and error states for every data panel."
    - "API client, stream store, TypeScript types, fixtures, and sequence/freshness handling."
    - "Responsive behavior down to 390px width."
    - "WCAG AA color and interaction requirements, reduced motion, keyboard support, and non-color-only state encoding."
  out:
    - "Marketing landing page."
    - "Authentication, authorization, multi-tenant roles, and public production deployment."
    - "Frontend identity tracking, raw MAC/device identifiers, or person-level tracking language."
    - "Production alert routing to phones, radios, PA, or external incident systems."
    - "Historical analytics, compliance reporting, replay import/export workflow, and dataset management."
    - "BLE, Wi-Fi, and Mesh adapter implementation in frontend; frontend only reflects backend availability."
    - "Predictive ML or route optimization."
    - "Mobile-first redesign beyond functional responsive support for demo review."

personas_and_jobs:
  user_types:
    - id: spectator
      label: "Spectator / glanceable judge"
      source: "ux-b user_types.spectator"
      needs:
        - "Instant comprehension."
        - "Headline metrics."
        - "Minimal controls."
        - "Guaranteed visual proof."
      default_mode: mock
    - id: investigator
      label: "Technical investigator / skeptical judge"
      source: "ux-b user_types.investigator"
      needs:
        - "Mode switching."
        - "Raw event tail access."
        - "Sensor topology."
        - "API and provenance credibility."
      default_mode: replay
    - id: operator
      label: "Venue or public-safety operator"
      source: "ux-b user_types.operator"
      needs:
        - "Zone-level numbers."
        - "Trend direction."
        - "Alert severity and acknowledgement."
        - "Coverage and degradation visibility."
      default_mode: hybrid
    - id: developer
      label: "Demo-resilient builder"
      source: "ux-b user_types.developer"
      needs:
        - "Seeded deterministic playback."
        - "Reset without reload."
        - "Graceful fallback."
        - "Stable contracts."
      default_mode: mock
    - id: frontend_partner
      label: "Frontend implementer"
      source: "ux-a primary job and frontend partner brief"
      needs:
        - "Stable aggregate payloads."
        - "Explicit state rules."
        - "Component boundaries."
        - "Acceptance checks and fixtures."
      default_mode: mock
  jobs:
    - id: job_glance
      priority: P0
      statement: "When I open the demo, I need to understand the product from an updating heatmap and headline metrics within 30 seconds."
      sources: ["ux-a job-1", "ux-b job-1-glance"]
    - id: job_trust
      priority: P0
      statement: "When I evaluate credibility, I need persistent provenance and mode controls so I can distinguish mock, replay, BLE, Wi-Fi, mesh, and hybrid data."
      sources: ["ux-a job-3", "ux-b job-2-trust"]
    - id: job_act
      priority: P0
      statement: "When congestion forms, I need a clear alert and a zone detail path with numeric occupancy, capacity, trend, severity, and source context."
      sources: ["ux-a job-2", "ux-b job-3-act"]
    - id: job_rehearse
      priority: P0
      statement: "When demoing, I need deterministic playback, reset without reload, and a guaranteed timed alert so the pitch can recover and repeat."
      sources: ["ux-b job-4-rehearse", "ux-b AP-1"]
    - id: job_stable_contract
      priority: P0
      statement: "When implementing, I need stable REST, WebSocket, and fixture shapes so the UI can proceed without reverse-engineering backend behavior."
      sources: ["ux-a job-4", "deadzone-api-contract.yaml", "deadzone-frontend-partner-brief.yaml"]
    - id: job_validate_coverage
      priority: P1
      statement: "When validating sensing, I need topology, sensor health, coverage gaps, and raw event tails on demand."
      sources: ["ux-a job-5", "ux-b job-5-validate-coverage", "ux-b job-6-investigate"]
    - id: job_degrade
      priority: P1
      statement: "When the stream stalls or sensors disappear, I need explicit stale/offline state with fallback options and last-known data preserved."
      sources: ["ux-a job-6", "ux-b task-8-handle-degradation"]
    - id: job_share_picture
      priority: P2
      mvp_status: post_mvp
      statement: "When multiple teams coordinate an event, they need a shared operating picture."
      sources: ["ux-b job-7-share-picture"]

success_criteria:
  product:
    - id: SC-01
      criterion: "First viewport is the operations dashboard, not a landing page or marketing page."
      priority: P0
      sources: ["ux-a summary", "ux-b summary"]
    - id: SC-02
      criterion: "Skeleton renders within 200ms of mount and first meaningful dashboard paint targets under 2s after usable data is available."
      priority: P0
      sources: ["ux-b interaction_fsm.design_constraints"]
    - id: SC-03
      criterion: "Judge can identify product purpose within 30 seconds from heatmap, metrics, legend, mode, and alerts."
      priority: P0
      sources: ["ux-b problem_spec.success_criteria"]
    - id: SC-04
      criterion: "Operations Dashboard renders snapshot data within 10 seconds of app load when backend is reachable."
      priority: P0
      sources: ["ux-a problem_spec.success_criteria", "deadzone-frontend-partner-brief.yaml"]
    - id: SC-05
      criterion: "Mock mode fires at least one deterministic alert within 90 seconds and re-arms on reset."
      priority: P0
      sources: ["ux-b LC-4", "ux-b interaction_fsm.screen-alerts-panel"]
    - id: SC-06
      criterion: "Mode switch completes under 400ms perceived transition, uses 300ms crossfade, and never flashes blank white content."
      priority: P0
      sources: ["ux-b problem_spec.success_criteria", "ux-b FSM design constraints"]
    - id: SC-07
      criterion: "A skeptical judge can reach topology and raw event tail within 3 clicks."
      priority: P1
      sources: ["ux-b problem_spec.success_criteria", "ux-b job-6-investigate"]
    - id: SC-08
      criterion: "Operator can identify highest-density zone with numeric occupancy/capacity above the fold."
      priority: P0
      sources: ["ux-b problem_spec.success_criteria", "ux-b LC-1"]
    - id: SC-09
      criterion: "Reset works without page reload through button and R key; Mock/Replay reset uses toast, BLE/Wi-Fi/Mesh/Hybrid reset uses modal confirmation."
      priority: P0
      sources: ["ux-b task-7-reset-demo", "ux-b wireframes screen 7"]
    - id: SC-10
      criterion: "Color-blind-safe density palette and non-color-only critical encoding are present."
      priority: P1
      sources: ["ux-b LC-5", "ux-a implementation notes"]
  implementation:
    - id: SC-11
      criterion: "Frontend renders from GET /api/v1/snapshot before WebSocket connects."
      priority: P0
      sources: ["deadzone-frontend-partner-brief.yaml", "deadzone-api-contract.yaml"]
    - id: SC-12
      criterion: "WebSocket messages are applied only when sequence is newer than the last applied sequence."
      priority: P0
      sources: ["deadzone-event-envelope.schema.json", "deadzone-frontend-partner-brief.yaml"]
    - id: SC-13
      criterion: "On disconnect or error, UI preserves last snapshot and marks stale/offline instead of blanking."
      priority: P0
      sources: ["ux-a constraint_bundle", "ux-b interaction_fsm.global_transitions"]
    - id: SC-14
      criterion: "Mobile layout remains usable at 390px width with map-first view and bottom sheets."
      priority: P1
      sources: ["deadzone-frontend-partner-brief.yaml", "ux-a wireframes mobile behavior"]

resolved_product_decisions:
  - id: RD-01
    decision: "One default dashboard route with overlays for MVP."
    rationale: "UX-B resolves spectator/investigator tension through progressive disclosure; separate tabs from UX-A are retained only as future deep-link labels."
    impacts:
      - "No route transition is required to inspect replay, topology, alerts, modes, or reset."
      - "Operations Dashboard remains first viewport at all times."
    sources: ["ux-a ia_schema.navigation", "ux-b ia_schema.navigation"]
  - id: RD-02
    decision: "Mock mode is default and auto-selected on first load."
    rationale: "It satisfies deterministic judging and avoids live RF permission risk."
    impacts:
      - "ModeChip shows MOCK and ProvenanceBadge says simulated data."
      - "Replay, BLE, Wi-Fi, Mesh, and Hybrid remain visible but availability-gated; the UI may group BLE/Wi-Fi/Hybrid under a Live Sensors label."
    sources: ["ux-b modes.mock", "deadzone-backend-scope.yaml"]
  - id: RD-03
    decision: "Topology is a toggle overlay, not the main screen."
    rationale: "Topology proves engineering for investigators but distracts spectators."
    impacts:
      - "Heatmap and topology do not render as competing full-strength layers."
      - "Coverage gaps use diagonal hatching."
    sources: ["ux-b LC-7", "ux-b composition rule 5"]
  - id: RD-04
    decision: "Every data panel must implement loading, empty, populated, and error behavior; stale applies to stream-backed panels."
    rationale: "Both runs identify blank panels as broken or untrustworthy."
    impacts:
      - "SkeletonPanel, EmptyState, and ErrorBoundary are required composition for all data panels."
    sources: ["ux-a interaction_fsm", "ux-b composition rule 1"]
  - id: RD-05
    decision: "Frontend never presents raw identity or stable device IDs."
    rationale: "Product promise is aggregate venue intelligence, not identity tracking."
    impacts:
      - "Raw event tail may show timestamp, sensor_id, RSSI, zone, and count only if backend guarantees no person/device identifiers."
    sources: ["ux-a problem_spec", "ux-b ia_schema Event note", "deadzone-backend-scope privacy rules"]
  - id: RD-06
    decision: "Alert acknowledgement is visual-only in MVP."
    rationale: "UX-B resolves alert depth tension by shipping severity plus local ack without routing/escalation."
    impacts:
      - "Ack state can be local UI state unless backend provides status updates."
    sources: ["ux-b task-5-acknowledge-alert", "ux-b divergence D3"]

information_architecture:
  route_model:
    default_route: "/"
    route_name: "Operations Dashboard"
    principle: "Single-screen dashboard with progressive disclosure overlays. No marketing page."
    future_deep_links:
      - path: "/?panel=replay"
        label: "Replay Lab deep link"
        mvp_required: false
      - path: "/?panel=topology"
        label: "Sensor Mesh deep link"
        mvp_required: false
      - path: "/?zone=:zoneId"
        label: "Zone Detail deep link"
        mvp_required: false
  global_chrome:
    header:
      required_items:
        - "DeadZone brand label."
        - "ModeChip."
        - "ProvenanceBadge."
        - "Reset button."
        - "Topology toggle."
        - "Settings button."
      behavior:
        - "Header is persistent in all dashboard states."
        - "ModeChip opens the mode switcher popover."
        - "Reset button mirrors R key behavior."
        - "Topology toggle swaps the visualization overlay."
    footer:
      required_items:
        - "ConnectionStatus."
        - "Last frame timestamp."
        - "Version."
      behavior:
        - "Footer must show stale, retrying, connected, disconnected, and offline states."
  surfaces:
    - id: dashboard
      type: "primary canvas"
      default_visible: true
      purpose: "First-viewport proof of crowd intelligence."
    - id: alerts_panel
      type: "right rail on desktop, bottom sheet/tab on mobile"
      default_visible: true
      purpose: "Show active/acknowledged alerts and system nominal state."
    - id: zone_detail
      type: "drawer"
      default_visible: false
      trigger: "zone click or alert view-zone action"
    - id: topology_overlay
      type: "map overlay plus side drawer"
      default_visible: false
      trigger: "topology toggle or sensor-focused action"
    - id: replay_picker
      type: "bottom drawer / transport bar"
      default_visible: false
      trigger: "mode set to replay"
    - id: mode_switcher
      type: "popover"
      default_visible: false
      trigger: "mode chip click"
    - id: settings
      type: "popover"
      default_visible: false
      trigger: "settings button"
    - id: reset_confirmation
      type: "toast or modal"
      default_visible: false
      trigger: "R key or reset click"

modes:
  - id: mock
    label: "MOCK"
    provenance_label: "Simulated data, seeded RNG"
    badge_color_token: "mode_mock"
    default: true
    behavior:
      - "Starts automatically on first load."
      - "Uses deterministic sequence."
      - "Fires one alert at 90s from demo session start."
      - "Reset is non-destructive and uses a toast."
  - id: replay
    label: "REPLAY"
    provenance_label: "Recorded scenario playback"
    badge_color_token: "mode_replay"
    default: false
    behavior:
      - "Opens replay drawer when selected."
      - "Supports scenario selection, play, pause, restart, seek, and speed."
      - "Reset is non-destructive and uses a toast."
  - id: live
    label: "LIVE"
    provenance_label: "Real-time BLE/Wi-Fi sensing"
    badge_color_token: "mode_live"
    default: false
    behavior:
      - "Visible in mode dropdown with availability indicator."
      - "Disabled with reason if backend says unavailable."
      - "Stale/offline failures are explicit and offer retry or fallback."
      - "Reset requires confirmation modal."
  - id: mesh
    label: "MESH"
    provenance_label: "Distributed mesh sensors"
    badge_color_token: "mode_mesh"
    default: false
    behavior:
      - "Visible in mode dropdown with availability indicator."
      - "Disabled with reason if gateway unavailable."
      - "Used as proof of the no-Wi-Fi story in pitch and topology."
      - "Reset requires confirmation modal."

data_contract:
  startup_sequence:
    - order: 1
      action: "GET /api/v1/config"
      ui_dependency: "Render mode availability, venue metadata, feature flags, and WebSocket URL."
    - order: 2
      action: "GET /api/v1/snapshot"
      ui_dependency: "Render dashboard before WebSocket connects."
    - order: 3
      action: "WS /ws/live"
      ui_dependency: "Apply StreamEnvelope messages by type and sequence."
    - order: 4
      action: "GET /api/v1/replay/scenarios"
      ui_dependency: "Populate replay picker when Replay mode is selected."
    - order: 5
      action: "POST /api/v1/replay/control"
      ui_dependency: "Control replay load, play, pause, restart, seek, and speed."
  required_schemas:
    - "AppConfig"
    - "IntelligenceSnapshot"
    - "StreamEnvelope"
    - "StreamState"
    - "Venue"
    - "Zone"
    - "ZoneAggregate"
    - "FlowVector"
    - "Alert"
    - "SensorNode"
    - "MeshLink"
    - "SnapshotMetrics"
    - "ReplayScenario"
    - "ReplayControlRequest"
    - "ErrorResponse"
  websocket_message_types:
    - type: snapshot
      ui_effect: "Replace or hydrate dashboard state."
    - type: zone_update
      ui_effect: "Update density, pressure, trend, selected-zone detail, and heatmap."
    - type: alert_upsert
      ui_effect: "Update AlertsPanel and highlight relevant zone."
    - type: sensor_status
      ui_effect: "Update topology, sensor detail, and offline/degraded indicators."
    - type: flow_update
      ui_effect: "Update movement vectors."
    - type: replay_state
      ui_effect: "Update replay transport and provenance."
    - type: error
      ui_effect: "Show recoverable inline error while preserving last snapshot."
  frontend_state_rules:
    - "Render from snapshot before WebSocket connects."
    - "Apply WebSocket messages only if sequence is greater than the last applied sequence."
    - "Ignore out-of-order messages and keep current UI stable."
    - "On disconnect, preserve last snapshot and mark stale."
    - "Never show a blank map unless both config and snapshot failed."
    - "Show mode, source label, freshness, and connection status in persistent chrome."
    - "Treat unavailable live modes as disabled options with reasons, not hidden options."
  fixtures_if_backend_lags:
    - "AppConfig with active_mode=mock, available_modes=[mock,replay], disabled_modes for live and mesh, venue metadata, feature flags, and websocket_url."
    - "IntelligenceSnapshot with at least 4 zones, 4 sensors, 2 flow vectors, 2 active alerts, 1 mesh link, and metrics."
    - "StreamEnvelope snapshot message."
    - "StreamEnvelope zone_update message."
    - "StreamEnvelope alert_upsert message."
    - "StreamEnvelope sensor_status message."
    - "StreamEnvelope flow_update message."
    - "StreamEnvelope replay_state message."
    - "StreamEnvelope error message."

functional_requirements:
  - id: FE-P0-01
    title: "Dashboard shell"
    priority: P0
    requirement: "Create operations-first layout with persistent header, metrics bar, map canvas, alerts panel, footer, and no marketing first screen."
    acceptance:
      - "First viewport shows dashboard chrome, status, map region, alert rail, and connection footer."
      - "Mode and freshness are visible without opening any drawer."
      - "No route or panel transition is needed to understand the product."
    sources: ["ux-a wireframes screen 1", "ux-b wireframes screen 1"]
  - id: FE-P0-02
    title: "API client and stream store"
    priority: P0
    requirement: "Load config and snapshot, then open WebSocket and manage sequence-aware stream state."
    acceptance:
      - "UI renders with WebSocket disabled if snapshot is available."
      - "Out-of-order messages are ignored."
      - "Disconnect marks stream stale while preserving last-known data."
    sources: ["deadzone-agent-task-bundle FE-02", "deadzone-event-envelope.schema.json"]
  - id: FE-P0-03
    title: "Heatmap, zones, legend, and flow vectors"
    priority: P0
    requirement: "Render venue coordinate plane, density/pressure heatmap, zone polygons, selected-zone state, movement vectors, and required legend."
    acceptance:
      - "Density changes are visible within 1 second of stream updates."
      - "Legend with unit is visible whenever heatmap is populated."
      - "Flow direction and magnitude are legible without color alone."
      - "Reduced motion preserves state meaning without animated blobs."
    sources: ["ux-a components", "ux-b components HeatmapLayer, ZoneOverlay, MovementVectors, Legend"]
  - id: FE-P0-04
    title: "Headline metrics"
    priority: P0
    requirement: "Show total occupancy, capacity or utilization, peak zone, trend, active alerts, and offline sensors above the fold."
    acceptance:
      - "Highest-density zone is identifiable with a numeric value above the fold."
      - "Metrics support skeleton, populated, and stale states."
      - "Metric values use tabular numbers or equivalent stable alignment."
    sources: ["ux-b LC-1", "ux-b MetricsBar"]
  - id: FE-P0-05
    title: "Alerts panel"
    priority: P0
    requirement: "Always show alerts right rail on desktop; show accessible alerts bottom sheet/tab on mobile."
    acceptance:
      - "Empty state reads 'No active alerts -- system nominal'."
      - "Alerts sort by severity and active status."
      - "Alert click highlights affected zone and opens zone detail."
      - "Acknowledgement is visual-only and moves alert to acknowledged section."
      - "Critical alerts trigger toast, with pauseable auto-dismiss."
    sources: ["ux-a AlertRail", "ux-b wireframes screen 6", "ux-b composition rule 4"]
  - id: FE-P0-06
    title: "Mode and provenance"
    priority: P0
    requirement: "Render ModeChip, ProvenanceBadge, ModeDropdown, and availability indicators for mock, replay, ble, wifi, mesh, and hybrid backend modes."
    acceptance:
      - "ModeChip and ProvenanceBadge are both visible in all populated, stale, error, and loading states."
      - "Disabled modes show the backend-provided reason."
      - "Mode switch uses crossfade and never white-flashes."
      - "Switch failure reverts to previous mode and shows reason."
    sources: ["ux-b ModeChip and ProvenanceBadge", "ux-b wireframes screen 5"]
  - id: FE-P0-07
    title: "Replay scenario picker and transport"
    priority: P0
    requirement: "When Replay mode is active, let user choose scenario, play, pause, restart, scrub/seek, and change speed."
    acceptance:
      - "Scenario list comes from GET /api/v1/replay/scenarios."
      - "Replay controls call POST /api/v1/replay/control."
      - "Ended replay holds final frame and offers restart."
      - "Load errors show alternate scenarios or fallback to Mock."
    sources: ["ux-a Replay Lab", "ux-b wireframes screen 4", "deadzone-api-contract.yaml"]
  - id: FE-P0-08
    title: "Demo reset"
    priority: P0
    requirement: "Support reset through header button and R key, without page reload."
    acceptance:
      - "R key is ignored when text input is focused."
      - "Mock/Replay reset uses toast and auto-confirms or confirms lightly."
      - "Live/Mesh reset uses focus-trapped confirmation modal."
      - "Reset clears alerts, resets timeline to t=0, re-arms the 90s alert, and preserves current mode label."
    sources: ["ux-b global transition gt-reset-key", "ux-b wireframes screen 7"]
  - id: FE-P1-01
    title: "Zone detail"
    priority: P1
    requirement: "On zone click or alert view-zone action, open a drawer/bottom sheet with occupancy, capacity, trend sparkline, and zone alerts."
    acceptance:
      - "Selected zone gets visible outline."
      - "No recent data state shows last seen timestamp and sparse sparkline fallback."
      - "Different zone click updates drawer without closing whole dashboard."
    sources: ["ux-b wireframes screen 2", "ux-b task-3-inspect-zone"]
  - id: FE-P1-02
    title: "Sensor topology overlay"
    priority: P1
    requirement: "Provide topology toggle that swaps from heatmap emphasis to sensor topology, including nodes, health, link quality, and coverage gaps."
    acceptance:
      - "Mock mode can show simulated nodes."
      - "Live mode with zero sensors shows explicit no-sensors state and actions."
      - "Coverage gaps use diagonal hatching."
      - "Topology overlay can close with Escape."
    sources: ["ux-a Sensor Mesh", "ux-b wireframes screen 3"]
  - id: FE-P1-03
    title: "Sensor detail and raw event tail"
    priority: P1
    requirement: "Clicking a sensor opens detail with sensor type, health, last seen, latency/RSSI where present, and last 10 aggregate-safe events."
    acceptance:
      - "Raw tail never displays stable device identifiers."
      - "Offline selected sensor stays visible with offline badge."
      - "Sensor detail has loading, empty, populated, and error states."
    sources: ["ux-b SensorDetailCard", "ux-b RawEventTail", "deadzone-backend-scope privacy rules"]
  - id: FE-P1-04
    title: "Settings popover"
    priority: P1
    requirement: "Provide settings for color-blind toggle, reduced motion behavior, keyboard hints, and optional local threshold preview."
    acceptance:
      - "Settings use popover with focus management."
      - "Changes preview immediately and can persist to local storage if implemented."
      - "Unsaved changes revert on close unless saved."
    sources: ["ux-b FSM screen-settings", "ux-b ColorBlindToggle"]
  - id: FE-P1-05
    title: "Responsive mobile behavior"
    priority: P1
    requirement: "At 390px width, preserve map-first workflow with bottom sheets and touch-safe controls."
    acceptance:
      - "Alerts become bottom sheet/tab with count badge."
      - "Replay controls remain usable."
      - "Touch targets are at least 44px."
      - "Text fits its container without overlap."
    sources: ["ux-a mobile behavior", "deadzone-frontend-partner-brief acceptance"]

screens_and_states:
  dashboard:
    states: ["booting", "connecting", "loading", "empty", "populated", "stale", "error", "demo_reset_pending"]
    key_transitions:
      - "app_mount -> connecting: render skeleton and Mock mode badge within 200ms."
      - "first_frame_received -> populated: crossfade skeleton to heatmap, render metrics and legend."
      - "no_frame_30s in Live/Mesh -> stale: preserve last snapshot and show stale badge."
      - "mode_switch -> loading: crossfade out, update badge, show skeleton for new mode."
      - "retry_click -> connecting: clear error and retry stream."
    required_feedback: ["connection badge", "last updated clock", "skeleton map", "inline error banner", "stale indicator"]
  zone_detail:
    states: ["closed", "opening", "loading", "empty", "populated", "error"]
    key_transitions:
      - "zone_click -> opening: highlight polygon and slide in panel."
      - "zone_data_received -> populated: render count, capacity, trend, sparkline, alerts."
      - "close_click_or_esc -> closed: remove highlight."
  topology:
    states: ["hidden", "loading", "empty", "populated", "sensor_selected", "error"]
    key_transitions:
      - "topology_toggle_click -> loading: render overlay skeleton and side panel."
      - "sensor_list_received -> populated: render nodes, health, links, and gap hatching."
      - "sensor_node_click -> sensor_selected: show sensor detail and raw event tail."
      - "topology_toggle_click -> hidden: close panel and restore heatmap."
  replay_picker:
    states: ["closed", "loading", "empty", "populated", "scenario_playing", "scenario_paused", "error"]
    key_transitions:
      - "mode_set_to_replay -> loading: open drawer and fetch scenarios."
      - "scenario_select -> scenario_playing: load scenario, show scrubber, start at 1x."
      - "speed_change -> scenario_playing: update playback rate and badge."
      - "mode_switch_away_from_replay -> closed: stop playback and close drawer."
  alerts_panel:
    states: ["loading", "empty", "populated", "alert_firing", "error"]
    key_transitions:
      - "alerts_loaded_none -> empty: show system nominal state."
      - "mock_timer_90s -> alert_firing: fire deterministic demo alert once per session."
      - "alert_click -> populated: highlight zone and open zone detail."
      - "alert_acknowledge -> populated: grey out and move to acknowledged section."
  mode_switcher:
    states: ["closed", "open", "switching"]
    key_transitions:
      - "mode_chip_click -> open: show modes with availability indicators."
      - "mode_selected_different -> switching: update dashboard through coordinated mode switch."
      - "new_mode_unavailable -> closed: revert to previous mode and show reason."
  settings:
    states: ["closed", "open", "saving"]
    key_transitions:
      - "settings_icon_click -> open: focus popover."
      - "save_click -> saving: persist local preferences if implemented."
      - "close_click_or_esc -> closed: close and revert unsaved changes."
  demo_reset:
    states: ["idle", "confirming_mock_replay", "confirming_live_mesh", "resetting", "complete"]
    key_transitions:
      - "R_key_or_reset_click in Mock/Replay -> confirming_mock_replay."
      - "R_key_or_reset_click in Live/Mesh -> confirming_live_mesh."
      - "reset_complete -> complete: fade heatmap to t=0, clear alerts, rearm 90s alert."

