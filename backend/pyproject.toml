[project]
name = "deadzone-backend"
version = "0.1.0"
description = "DeadZone backend — FastAPI + WebSocket crowd-intelligence server"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
deadzone-backend = "app.cli:serve"
deadzone-permissions = "app.cli:permissions"
deadzone-scan = "app.cli:scan"

[project.optional-dependencies]
sensors = [
    "scapy>=2.6",
    "meshtastic>=2.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
