meta:
  project: deadzone
  component: backend
  purpose: "Backend implementation scope for the hackathon MVP."
  api_contract: ".lev/pm/specs/deadzone-api-contract.yaml"
  task_bundle: ".lev/pm/plans/deadzone-agent-task-bundle.yaml"

mvp_boundary:
  must_ship:
    - "FastAPI app with health, config, snapshot, zones, sensors, replay, and WebSocket endpoints."
    - "Local BLE capture source that records privacy-safe RSSI observations from this machine."
    - "Replay source that uses locally captured BLE traces, not bundled synthetic scenarios."
    - "Mock source derived from locally captured BLE trace shape and disabled until a trace exists."
    - "Aggregate intelligence snapshots for frontend consumption."
    - "Docker compose path that starts without hardware dependencies."
  should_ship:
    - "Adapter interface and disabled-mode responses for BLE, Wi-Fi, and Mesh."
    - "Contract tests for response and WebSocket envelope shapes."
    - "Fallback snapshot endpoint for frontend reconnect recovery."
  stretch:
    - "BLE adapter using optional dependency loading."
    - "Meshtastic gateway adapter with compact telemetry summaries."
    - "SQLite persistence for replay/debug traces."

runtime_architecture:
  source_layer:
    description: "Produces normalized internal observations or aggregate scenario frames."
    modules:
      - "sources/base.py: SensorSource protocol"
      - "sources/ble.py: local BLE advertisement capture and normalization"
      - "sources/replay.py: locally captured BLE trace reader and clock"
      - "sources/mock.py: mock generator derived from captured BLE traces"
      - "sources/wifi.py: optional adapter stub"
      - "sources/mesh.py: optional adapter stub"
  intelligence_layer:
    description: "Turns observations/frames into stable dashboard objects."
    modules:
      - "spatial/venue.py: static venue zones and coordinates"
      - "spatial/aggregate.py: density, pressure, confidence, trend"
      - "spatial/alerts.py: congestion, queue, stall, sensor offline heuristics"
      - "spatial/flow.py: movement vectors"
  delivery_layer:
    description: "Serves REST snapshots and WebSocket envelopes."
    modules:
      - "api/routes.py: REST endpoints"
      - "api/ws.py: WebSocket connection manager"
      - "runtime/engine.py: source selection, clock, latest snapshot, broadcaster"

data_flow:
  - "SensorSource emits internal observations or scenario frames."
  - "Aggregator updates zone density, pressure_score, trend, and confidence."
  - "Heuristics upsert alerts and sensor health."
  - "Runtime composes IntelligenceSnapshot."
  - "REST exposes latest snapshot; WebSocket broadcasts StreamEnvelope messages."

mode_strategy:
  mock:
    default: false
    dependencies: ["at least one local BLE capture trace"]
    behavior: "Seeded variation over locally captured BLE trace shape."
  replay:
    default: false
    dependencies: ["local BLE capture JSONL files"]
    behavior: "Deterministic playback of locally captured BLE observations with controls."
  ble:
    default: true
    dependencies: ["bleak", "Bluetooth permissions"]
    behavior: "Primary real-data mode; captures local BLE advertisements into privacy-safe traces."
  wifi:
    default: false
    dependencies: ["scapy", "Linux monitor mode"]
    behavior: "Disabled by default; do not block startup."
  mesh:
    default: false
    dependencies: ["meshtastic", "serial/device access"]
    behavior: "Disabled by default; topology can be mocked."

privacy_and_data_rules:
  - "Never persist raw MAC addresses or stable device identifiers."
  - "Expose aggregate density, pressure, movement, and sensor health only."
  - "If raw observations are needed internally, hash or discard identifiers before leaving adapter scope."
  - "Do not make identity tracking part of the frontend contract."

first_demo_trace_flow:
  - id: "capture-local-ble"
    story: "Run BLE capture from the local machine and record privacy-safe RSSI observations."
    required_alerts: ["sensor_offline when no advertisements are observed"]
  - id: "replay-local-capture"
    story: "Replay the captured trace through the same aggregate snapshot pipeline."
    required_alerts: ["queue_buildup or congestion only when captured density supports it"]
  - id: "mock-from-local-capture"
    story: "Generate mock variation only from the locally captured trace shape."
    required_alerts: ["no invented density claims before capture exists"]

backend_done_checks:
  - "`curl localhost:8000/health` returns ok=true."
  - "`curl localhost:8000/api/v1/snapshot` returns StreamState, Venue, ZoneAggregate, FlowVector, Alert, SensorNode, MeshLink, and metrics objects."
  - "WebSocket `/ws/live` emits at least one snapshot envelope and ongoing updates."
  - "Replay scenarios list includes locally captured BLE trace ids after capture."
  - "Unavailable live adapters are represented as disabled modes, not import/startup failures."
